        	max-width: 1400px;
        	margin: auto;
    	}
		.menu-container a {
        	background-color: #ffffff;
    	}
		/* Tombol 3 dimensi */
    	.tombol {
        	min-height: 100px;
        	padding: 18px 12px;
			display: flex;
        	align-items: center;
        	justify-content: center;
        	text-align: center;
			background: linear-gradient (to bottom, #ffffff 100%, #dce5ef 45%, #e8edf3 10%);
			color: #20364f;
        	font-size: 16px;
        	font-weight: bold;
        	text-decoration: none;
			border: 1px solid #9aadc2;
        	border-radius: 10px;
			/* Efek tombol timbul */
        	box-shadow:
        	0 7px 0 #71869c,
            0 10px 14px rgba(0, 0, 0, 0.20);
			cursor: pointer;
        	transition: all 0.12s ease;
    	}
		/* Efek saat mouse diarahkan */
    	.tombol:hover {
        	background: linear-gradient(180deg, #ffffff, #c9e5ff);
        	transform: translateY(-2px);
			box-shadow:
            0 9px 0 #527da4,
            0 13px 18px rgba(0, 0, 0, 0.22);
    	}
		/* Efek saat tombol ditekan */
    	.tombol:active {
        	transform: translateY(6px);
			box-shadow:
            0 1px 0 #71869c,
            0 3px 5px rgba(0, 0, 0, 0.15);
    	}
		/* Responsif untuk layar kecil */
    	@media (max-width: 900px) {
        	body {
            	padding: 25px;
        	}
			.menu-container {
            	grid-template-columns: repeat(2, 1fr);
            	gap: 30px;
        	}
    	}
		@media (max-width: 480px) {
        	body {
            	padding: 18px;
        	}
			.menu-container {
            	grid-template-columns: 1fr;
            	gap: 25px;

    	}
